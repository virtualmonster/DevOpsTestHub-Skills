note: 'GET /health returns ok'
configuration:
  vars:
    BASE_URL: http://localhost:5000/api
steps:
  - send:
      note: 'GET /health'
      url: ${BASE_URL}/health
      request:
        fields:
          - method:
              - val: GET
          - headers/accept:
              - val: application/json
      response:
        fields:
          - status-code:
              - val: '200'
          - content/status:
              - val: 'ok'
          - content/database:
              - var: DATABASE
  - log: 'Backend database: ${DATABASE}'
