note: 'GET /images/{file} serves a JPEG'
configuration:
  vars:
    BASE_URL: http://localhost:5000/api
steps:
  - send:
      note: 'GET /images/1-swift-xc-pro.jpg'
      url: ${BASE_URL}/images/1-swift-xc-pro.jpg
      request:
        fields:
          - method:
              - val: GET
          - headers/accept:
              - val: application/json
      response:
        fields:
          - status-code:
              - val: '200'
