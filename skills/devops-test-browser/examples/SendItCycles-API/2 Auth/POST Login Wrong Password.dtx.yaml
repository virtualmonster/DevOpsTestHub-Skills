note: 'Login with a wrong password returns 401'
configuration:
  vars:
    BASE_URL: http://localhost:5000/api
    TOKEN: ''
    USER_ID: ''
    EMAIL: ''
    PASSWORD: ''
steps:
  - run:
      url: ../modules/Register And Login.dtx.yaml
      out:
        TOKEN: {}
        USER_ID: {}
        EMAIL: {}
        PASSWORD: {}
  - send:
      note: 'POST /auth/login with the wrong password'
      url: ${BASE_URL}/auth/login
      request:
        fields:
          - method:
              - val: POST
          - headers/accept:
              - val: application/json
          - headers/content-type:
              - val: application/json
          - content:
              - val: '{"email":"${EMAIL}","password":"definitely-not-the-password"}'
      response:
        fields:
          - status-code:
              - val: '401'
          - content/error:
              - val: 'Invalid credentials'
