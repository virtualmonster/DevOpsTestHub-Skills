note: 'Login without a password returns 400'
configuration:
  vars:
    BASE_URL: http://localhost:5000/api
steps:
  - send:
      note: 'POST /auth/login without password'
      url: ${BASE_URL}/auth/login
      request:
        fields:
          - method:
              - val: POST
          - headers/accept:
              - val: application/json
          - headers/content-type:
              - val: application/json
          - content:
              - val: '{"email":"nobody@example.com"}'
      response:
        fields:
          - status-code:
              - val: '400'
          - content/error:
              - val: 'Email and password required'
