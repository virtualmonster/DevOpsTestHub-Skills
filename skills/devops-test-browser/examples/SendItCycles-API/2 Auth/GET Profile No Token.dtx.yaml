note: 'Profile without a token returns 401'
configuration:
  vars:
    BASE_URL: http://localhost:5000/api
steps:
  - send:
      note: 'GET /auth/profile without a token'
      url: ${BASE_URL}/auth/profile
      request:
        fields:
          - method:
              - val: GET
          - headers/accept:
              - val: application/json
      response:
        fields:
          - status-code:
              - val: '401'
          - content/error:
              - val: 'No token provided'
