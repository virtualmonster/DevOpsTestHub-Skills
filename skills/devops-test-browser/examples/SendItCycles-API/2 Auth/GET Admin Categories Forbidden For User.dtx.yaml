note: 'A normal user is refused on an admin route with 403 (read-only admin call)'
configuration:
  vars:
    BASE_URL: http://localhost:5000/api
    TOKEN: ''
    USER_ID: ''
    EMAIL: ''
    PASSWORD: ''
steps:
  - run:
      url: ../modules/Register And Login.dtx.yaml
      out:
        TOKEN: {}
        USER_ID: {}
        EMAIL: {}
        PASSWORD: {}
  - send:
      note: 'GET /admin/categories as a normal user'
      url: ${BASE_URL}/admin/categories
      request:
        fields:
          - method:
              - val: GET
          - headers/accept:
              - val: application/json
          - auth/bearer/token:
              - val: '${TOKEN}'
      response:
        fields:
          - status-code:
              - val: '403'
          - content/error:
              - val: 'Admin access required'
