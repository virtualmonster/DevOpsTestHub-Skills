    assignVariable: initialValue
steps:
  - run: html-multiline.dtv.yaml
  - log: After stub
  - with:
      note: Selenium Friendly Form
      steps:
        - open:
            url: '${TEST_ENDPOINT}'
        - click:
            object: html.textarea
            identifiers:
              - properties:
                  - placeholder: Type text and press Enter to submit
        - type:
            object: html.textarea
            identifiers:
              - properties:
                  - placeholder: Type text and press Enter to submit
            value: '${Multi_Line_text}'
        - click:
            object: html.button
            identifiers:
              - properties:
                  - content: Submit
        - verify:
            object: html.textarea
            identifiers:
              - properties:
                  - id: outputArea
            properties:
              - content: '${Multi_Line_text}'
